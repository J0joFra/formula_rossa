name: F1 Race Weekend Publisher

# ─── TRIGGER ────────────────────────────────────────────────────────────────────
# Questo workflow si esegue automaticamente secondo il calendario F1 2026.
# Logica:
#   - Giorno prima del GP  (venerdi):  articolo preview/anteprima weekend
#   - Qualifiche (sabato):             articolo qualifiche (live + analisi post)
#   - Giorno della gara (domenica):    articolo pre-gara (mattina) + post-gara (sera)
#   - Giorno dopo (lunedì):            articolo recap & classifiche

# ATTENZIONE sull'ultimo campo dei cron (giorno della settimana): deve restare
# "*". In cron, quando sia il giorno del mese sia il giorno della settimana sono
# valorizzati, le due condizioni si combinano in OR e non in AND. Scrivendo
# "0 8 6 3 5" per intendere "6 marzo alle 8" si ottiene invece "6 marzo OPPURE
# ogni venerdì di marzo": il bot partiva 206 volte l'anno invece di 110, e nei
# weekend senza gara pubblicava l'anteprima di un Gran Premio inesistente.

on:
  schedule:

    # ──── AUSTRALIA GP (6–8 mar 2026) ─────────────────────────────
    - cron: "0 8 6 3 *"
    - cron: "0 8 7 3 *"
    - cron: "0 8 8 3 *"
    - cron: "0 16 8 3 *"
    - cron: "0 8 9 3 *"

