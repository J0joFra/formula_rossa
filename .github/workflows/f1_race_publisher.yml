  # Consente anche l'esecuzione manuale da GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità articolo (preview / qualifiche / pre-gara / post-gara / recap)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - qualifiche
          - pre-gara
          - post-gara
          - recap
      gp_name:
        description: "Nome del Gran Premio (es. Monaco)"
        required: false
        default: ""

# ─── JOB ────────────────────────────────────────────────────────────────────────
jobs:
  publish:
    name: "Pubblica articolo F1"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Installa dipendenze
        run: pip install feedparser groq firebase-admin python-dotenv schedule

      - name: Ripristina seen_articles.json dalla cache
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: seen-articles-

      - name: Determina la modalità in base alla data/ora
        id: detect_mode
        run: |
          python3 - <<'EOF'
          import os
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          hour = now.hour
          weekday = now.weekday()  # 0=Lun, 4=Ven, 5=Sab, 6=Dom

          # Sovrascrittura manuale da workflow_dispatch
          manual = "${{ github.event.inputs.mode }}"
          if manual:
              mode = manual
          elif weekday == 4:           # Venerdì
              mode = "preview"
          elif weekday == 5:           # Sabato
              mode = "qualifiche"
          elif weekday == 6 and hour < 13:  # Domenica mattina
              mode = "pre-gara"
          elif weekday == 6:           # Domenica pomeriggio/sera
              mode = "post-gara"
          else:                        # Lunedì
              mode = "recap"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")

          print(f"Modalità rilevata: {mode}")
          EOF

      - name: Esegui aggregatore F1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          F1_MODE: ${{ steps.detect_mode.outputs.mode }}
          GP_NAME: ${{ github.event.inputs.gp_name }}
        run: |
          # Credenziali Firebase dal secret
          echo "$FIREBASE_CREDENTIALS_JSON" > F1bot/firebase-credentials.json
          python F1bot/f1_aggregator.py --mode "$F1_MODE" ${GP_NAME:+--gp "$GP_NAME"}

      - name: Salva seen_articles.json aggiornato
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
