name: F1 Race Weekend Publisher

# ─── TRIGGER ────────────────────────────────────────────────────────────────────
# Due orari fissi al giorno; cosa pubblicare lo decide lo step "Determina la
# modalità" leggendo il calendario 2026 qui sotto (RACE_DAYS):
#   - 2 giorni prima della gara:   anteprima del weekend   (preview)
#   - 1 giorno prima:              qualifiche              (qualifiche)
#   - giorno della gara, 08 UTC:   pre-gara                (pre-gara)
#   - giorno della gara, 16 UTC:   post-gara               (post-gara)
#   - giorno dopo:                 recap e classifiche     (recap)
#   - tutti gli altri giorni, 08 UTC: sintesi quotidiana   (normale)
#
# Prima c'era un cron per ogni giorno di ogni Gran Premio, 110 in tutto. Dopo
# la modifica del 1° settembre GitHub ha smesso di avviare il workflow (ultima
# esecuzione: 12 luglio), la pulizia giornaliera ha continuato a cancellare gli
# articoli dopo 30 giorni e la pagina /news si è svuotata. Due cron fissi e il
# calendario nello script non hanno quel problema, e la modalità si ricava dalla
# distanza dalla gara invece che dal giorno della settimana: così funzionano
# anche i GP che si corrono di sabato (Baku, Las Vegas).

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"

  # Consente anche l'esecuzione manuale da GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità articolo (normale / preview / qualifiche / pre-gara / post-gara / recap)"
        required: true
        default: "normale"
        type: choice
        options:
          - normale
          - preview
          - qualifiche
          - pre-gara
          - post-gara
          - recap
      gp_name:
        description: "Nome del Gran Premio (es. Monaco)"
        required: false
        default: ""

# ─── JOB ────────────────────────────────────────────────────────────────────────
jobs:
  publish:
    name: "Pubblica articolo F1"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install feedparser groq firebase-admin python-dotenv schedule

      - name: Ripristina seen_articles.json dalla cache
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
          restore-keys: seen-articles-

      - name: Determina la modalità in base alla data/ora
        id: detect_mode
        env:
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_GP: ${{ github.event.inputs.gp_name }}
        run: |
          python3 - <<'EOF'
          import os
          from datetime import date, datetime, timezone

          # Giorno della gara (UTC) → nome del Gran Premio. Calendario 2026.
          RACE_DAYS = {
              date(2026, 3, 8):   "Australia",
              date(2026, 3, 15):  "Cina",
              date(2026, 3, 29):  "Giappone",
              date(2026, 5, 3):   "Miami",
              date(2026, 5, 24):  "Canada",
              date(2026, 6, 7):   "Monaco",
              date(2026, 6, 14):  "Spagna",
              date(2026, 6, 28):  "Austria",
              date(2026, 7, 5):   "Gran Bretagna",
              date(2026, 7, 19):  "Belgio",
              date(2026, 7, 26):  "Ungheria",
              date(2026, 8, 23):  "Olanda",
              date(2026, 9, 6):   "Italia",
              date(2026, 9, 13):  "Madrid",
              date(2026, 9, 26):  "Azerbaijan",
              date(2026, 10, 11): "Singapore",
              date(2026, 10, 25): "Stati Uniti",
              date(2026, 11, 1):  "Messico",
              date(2026, 11, 8):  "Brasile",
              date(2026, 11, 22): "Las Vegas",
              date(2026, 11, 29): "Qatar",
              date(2026, 12, 6):  "Abu Dhabi",
          }
          # Distanza dalla gara (in giorni) → modalità.
          OFFSET_MODE = {-2: "preview", -1: "qualifiche", 1: "recap"}

          now = datetime.now(timezone.utc)
          today = now.date()
          mode, gp, skip = "", "", False

          if os.environ.get("MANUAL_MODE"):
              mode, gp = os.environ["MANUAL_MODE"], os.environ.get("MANUAL_GP", "")
          else:
              for race_day, name in RACE_DAYS.items():
                  offset = (today - race_day).days
                  if offset == 0:
                      mode, gp = ("pre-gara" if now.hour < 13 else "post-gara"), name
                  elif offset in OFFSET_MODE:
                      mode, gp = OFFSET_MODE[offset], name
                  if mode:
                      break
              if not mode:
                  # Fuori dal weekend di gara: una sintesi al mattino, niente il pomeriggio.
                  mode, skip = "normale", now.hour >= 13
              elif mode != "post-gara" and now.hour >= 13:
                  # Il cron delle 16 serve solo al post-gara.
                  skip = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"gp={gp}\n")
              f.write(f"skip={'true' if skip else 'false'}\n")

          print(f"Modalità: {mode} | GP: {gp or '-'} | salta: {skip}")
          EOF

      - name: Esegui aggregatore F1
        if: steps.detect_mode.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          F1_MODE: ${{ steps.detect_mode.outputs.mode }}
          GP_NAME: ${{ steps.detect_mode.outputs.gp }}
          FIREBASE_CREDENTIALS: F1bot/firebase-credentials.json
        run: |
          echo "$FIREBASE_CREDENTIALS_JSON" > F1bot/firebase-credentials.json
          python F1bot/f1_aggregator.py --mode "$F1_MODE" ${GP_NAME:+--gp "$GP_NAME"}

      - name: Salva seen_articles.json aggiornato
        if: steps.detect_mode.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: seen_articles.json
          key: seen-articles-${{ github.run_id }}
